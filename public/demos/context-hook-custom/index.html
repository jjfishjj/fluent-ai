<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>自選情境訓練 · MemoLingua</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#142235;font-family:Inter,"Noto Sans TC",system-ui,sans-serif}.top{height:68px;padding:0 5vw;background:#fff;border-bottom:1px solid #dce4ed;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}.top a{text-decoration:none;color:#334155;font-weight:900}.tag{padding:8px 13px;border-radius:999px;background:#e8fff9;color:#087565;font-size:12px;font-weight:900}.wrap{max-width:1240px;margin:auto;padding:28px 20px 70px}.hero{padding:34px;border-radius:28px;background:linear-gradient(135deg,#101b39,#134d57);color:#fff}.hero small{color:#68eed9;font-weight:900;letter-spacing:.18em}.hero h1{font-size:clamp(30px,5vw,50px);margin:10px 0}.hero p{max-width:800px;color:#cbd8e7;line-height:1.75}.builder{display:grid;grid-template-columns:350px 1fr;gap:18px;margin-top:20px}.panel,.card{background:#fff;border:1px solid #dce4ed;border-radius:22px;padding:22px}.panel h2,.card h2{margin-top:0}.preset-list{display:grid;gap:9px}.preset{border:1px solid #d6dee8;border-radius:13px;background:#fff;padding:13px;text-align:left;font-weight:900;cursor:pointer}.preset:hover,.preset.active{background:#ecfff9;border-color:#1fba9d;color:#087565}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field.wide{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:900;color:#5a687b;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #cbd5e1;border-radius:11px;padding:11px;font:inherit;background:#fff}.field input,.field select{height:44px}.field textarea{min-height:84px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.btn{border:0;border-radius:11px;background:#109b85;color:#fff;padding:12px 17px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}.btn.secondary{background:#fff;color:#415166;border:1px solid #cbd5e1}.preview{margin-top:18px;background:linear-gradient(145deg,#123c50,#176b60);color:#fff;border-radius:24px;padding:22px;overflow:hidden}.preview-head{display:flex;justify-content:space-between;gap:15px}.preview h2{margin:5px 0}.meta{text-align:right;color:#c8fff4;font-size:12px;line-height:1.6}.stage{height:300px;margin-top:14px;position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(#cceeea 0 32%,#85b9b2 32% 34%,#527a76 34%);border:1px solid #ffffff45}.stage:before{content:"";position:absolute;inset:34% -10% -30%;background:repeating-linear-gradient(90deg,#fff2 0 1px,transparent 1px 70px),repeating-linear-gradient(0deg,#fff2 0 1px,transparent 1px 55px);transform:perspective(400px) rotateX(55deg);transform-origin:top}.location-icon{position:absolute;left:50%;top:13%;transform:translateX(-50%);font-size:50px;filter:drop-shadow(0 7px 7px #1235)}.person{position:absolute;z-index:3;text-align:center;font-weight:900}.person span{display:grid;place-items:center;width:58px;height:58px;border:4px solid #fff;border-radius:50%;background:#ef806d;font-size:28px}.person small{display:block;background:#15394b;border-radius:999px;padding:5px 8px;margin-top:4px;white-space:nowrap}.person.ai{left:10%;top:40%}.person.user{right:9%;bottom:7%}.scene-objects{position:absolute;z-index:4;left:22%;right:22%;top:48%;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.scene-object{border:0;background:#fff;color:#17344a;border-radius:11px;padding:9px 11px;font-weight:900;box-shadow:0 7px 13px #1235;cursor:pointer}.scene-object.seen{outline:4px solid #5ff5d1;transform:translateY(-3px)}.mission{margin-top:13px;background:#effdfa;color:#173a36;border-left:4px solid #27c5a4;border-radius:0 12px 12px 0;padding:13px;line-height:1.65}.training{display:none;margin-top:20px}.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}.step{background:#fff;border:1px solid #dce4ed;border-radius:12px;padding:9px;text-align:center;font-size:12px;font-weight:900;color:#8290a2}.step.on{background:#eafff9;border-color:#35c9aa;color:#087565}.step.done{background:#109b85;color:#fff}.options{display:grid;gap:10px}.option{border:1px solid #d6dee8;background:#fff;border-radius:13px;padding:13px;text-align:left;font-weight:800;cursor:pointer}.option:hover,.option.selected{background:#edfff9;border-color:#20b99c}.input{width:100%;min-height:120px;border:1px solid #cbd5e1;border-radius:13px;padding:14px;font:inherit}.feedback{display:none;margin-top:13px;background:#ecfdf5;color:#175b48;border-radius:13px;padding:14px;line-height:1.65}.feedback.show{display:block}.compare{display:grid;gap:9px}.answer{background:#fff;border:1px solid #b7e4d7;border-radius:10px;padding:11px}.answer.ref{background:#fff9dc;border-color:#f1d269;color:#604b00}.answer small{display:block;font-weight:900}.object-check{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.check{padding:9px 11px;border-radius:999px;background:#eef2f7;color:#64748b;font-weight:900}.check.done{background:#dcfce7;color:#166534}.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#f7f9fc;border-radius:13px;padding:15px;text-align:center}.metric b{display:block;font-size:26px;color:#0f927e;margin-top:5px}@media(max-width:850px){.builder{grid-template-columns:1fr}.preset-list{grid-template-columns:repeat(3,1fr)}.panel{padding:18px}.meta{display:none}}@media(max-width:560px){.fields,.report-grid{grid-template-columns:1fr}.preset-list{grid-template-columns:1fr 1fr}.progress{grid-template-columns:repeat(2,1fr)}.preview{padding:15px}.stage{height:320px}.scene-objects{left:17%;right:17%}.top{padding:0 15px}.tag{display:none}}
  </style>
</head>
<body>
  <header class="top"><a href="../context-hook-training/">← 返回情境鉤子 Demo</a><span class="tag">MemoLingua · 自選情境 Demo</span></header>
  <main class="wrap">
    <section class="hero"><small>CUSTOM CONTEXT TRAINING</small><h1>選一個你真的會用到的場景</h1><p>從參考場景開始，再自由修改人物、物件、任務與目標詞彙。系統會把你選擇的內容直接轉成觀察、選擇、組句、無提示回想與比較報告。</p></section>
    <section id="builder" class="builder">
      <aside class="panel"><h2>① 選擇參考場景</h2><div id="presets" class="preset-list"></div><div class="mission"><b>也可以完全自訂</b><br>選擇最接近的場景後，再修改右側所有文字。</div></aside>
      <section class="panel"><h2>② 修改場景與文字</h2><div class="fields">
        <div class="field"><label>學習語言</label><select id="language"><option>English</option><option>Japanese</option><option>Korean</option><option>Spanish</option></select></div>
        <div class="field"><label>訓練名稱</label><input id="title"></div>
        <div class="field"><label>明確時間</label><input id="time"></div><div class="field"><label>具體地點</label><input id="place"></div>
        <div class="field"><label>AI 扮演角色</label><input id="aiRole"></div><div class="field"><label>你的角色</label><input id="userRole"></div>
        <div class="field wide"><label>必須完成的目的</label><input id="goal"></div><div class="field wide"><label>突發狀況</label><input id="surprise"></div>
        <div class="field wide"><label>可見物件（用逗號分隔，3–5 個）</label><input id="objects"></div>
        <div class="field wide"><label>核心詞彙或句型（用逗號分隔，最多 5 個）</label><input id="vocab"></div>
        <div class="field wide"><label>主要參考答案</label><textarea id="reference"></textarea></div>
      </div><div class="actions"><button class="btn secondary" onclick="refreshPreview()">更新預覽</button><button id="generate" class="btn" onclick="generateTraining()">產生自選情境訓練 →</button></div></section>
    </section>
    <section id="preview" class="preview"></section>
    <section id="training" class="training"><div id="progress" class="progress"></div><article id="activity" class="card"></article></section>
  </main>
  <script>
    const $=s=>document.querySelector(s);
    const presets={
      cafe:{label:'☕ 咖啡店點餐',icon:'☕',title:'客製化咖啡點餐',time:'週六上午 9:20',place:'車站旁的繁忙咖啡店',aiRole:'咖啡師 Mia',userRole:'趕著搭車的顧客',goal:'確認飲品規格並在五分鐘內完成點餐',surprise:'燕麥奶剛好售完',objects:'📋 菜單, ☕ 咖啡杯, 🥛 牛奶瓶, 🧾 收據',vocab:'recommend, oat milk, available, take away, receipt',reference:'Could you recommend a dairy-free option that is available? I would like it to take away, please.'},
      airport:{label:'✈️ 機場改班',icon:'✈️',title:'航班異動協商',time:'週一下午 3:40',place:'國際機場轉機櫃台',aiRole:'航空公司地勤 Daniel',userRole:'轉機時間不足的旅客',goal:'改到能趕上會議的航班',surprise:'原航班延誤兩小時',objects:'🛫 登機證, 🧳 行李箱, 🖥️ 航班螢幕, 🛂 護照',vocab:'delayed, connection, available flight, luggage, rebook',reference:'My flight is delayed and I will miss my connection. Could you rebook me on the next available flight and confirm my luggage transfer?'},
      hotel:{label:'🏨 飯店入住',icon:'🏨',title:'飯店入住與房型處理',time:'週五晚上 8:10',place:'市中心飯店櫃台',aiRole:'櫃台人員 Emma',userRole:'出差入住的房客',goal:'完成入住並取得安靜房間',surprise:'預訂的房型已經客滿',objects:'🔑 房卡, 🧳 行李, 🧾 訂房單, 🛎️ 服務鈴',vocab:'reservation, available, upgrade, quiet room, confirmation',reference:'I have a reservation and confirmation for a quiet room. Since that room is unavailable, could you offer an upgrade?'},
      interview:{label:'💼 工作面試',icon:'💼',title:'產品職位面試',time:'週三上午 11:00',place:'科技公司的視訊面試室',aiRole:'招募經理 Jordan',userRole:'產品經理候選人',goal:'用實例說明協作與解題能力',surprise:'臨時要求用英文回答',objects:'💻 視訊畫面, 📄 履歷, 📊 專案圖表, ⏱️ 計時器',vocab:'collaborate, challenge, outcome, prioritize, improve',reference:'I collaborated with engineering to prioritize the main challenge, and we improved the outcome by testing the solution early.'},
      clinic:{label:'🏥 診所看診',icon:'🏥',title:'描述症狀與確認用藥',time:'週二下午 2:30',place:'社區診所診間',aiRole:'醫師 Dr. Lee',userRole:'前來看診的患者',goal:'清楚描述症狀並確認用藥方式',surprise:'常用藥物可能造成過敏',objects:'🌡️ 體溫計, 💊 藥盒, 📋 病歷, 🥤 水杯',vocab:'symptom, allergy, dosage, side effect, prescription',reference:'My main symptom is a headache, and I have a medication allergy. Could you explain the dosage and possible side effects of this prescription?'}
    };
    let selected='cafe',config=null,step=0,seen=[];
    const fields=['title','time','place','aiRole','userRole','goal','surprise','objects','vocab','reference'];
    function escapeHtml(text){return String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
    function list(value,max=5){return value.split(/[,，]/).map(x=>x.trim()).filter(Boolean).slice(0,max)}
    function choosePreset(key){selected=key;document.querySelectorAll('.preset').forEach(x=>x.classList.toggle('active',x.dataset.key===key));const p=presets[key];fields.forEach(id=>$('#'+id).value=p[id]);refreshPreview()}
    function readConfig(){return {language:$('#language').value,icon:presets[selected]?.icon||'📍',...Object.fromEntries(fields.map(id=>[id,$('#'+id).value.trim()])),objectList:list($('#objects').value),vocabList:list($('#vocab').value)}}
    function refreshPreview(){const c=readConfig();$('#preview').innerHTML=`<div class="preview-head"><div><small>CUSTOM LIVE SCENE · ${escapeHtml(c.language)}</small><h2>${escapeHtml(c.title||'尚未命名的場景')}</h2></div><div class="meta">${escapeHtml(c.time)}<br>${escapeHtml(c.place)}<br>${escapeHtml(c.surprise)}</div></div><div class="stage"><div class="location-icon">${c.icon}</div><div class="person ai"><span>🤖</span><small>${escapeHtml(c.aiRole||'AI 角色')}</small></div><div class="person user"><span>🧑🏻</span><small>${escapeHtml(c.userRole||'你的角色')}</small></div><div class="scene-objects">${c.objectList.map((x,i)=>`<button class="scene-object" onclick="observeObject(${i},this)">${escapeHtml(x)}</button>`).join('')}</div></div><div class="mission"><b>目的：</b>${escapeHtml(c.goal)}<br><b>突發狀況：</b>${escapeHtml(c.surprise)}</div>`}
    function observeObject(index,button){if(!seen.includes(index))seen.push(index);button.classList.add('seen');const n=$('#seenCount');if(n)n.textContent=Math.min(seen.length,3);const go=$('#observeNext');if(go)go.disabled=seen.length<Math.min(3,config.objectList.length)}
    function generateTraining(){config=readConfig();if(!config.title||config.objectList.length<3||config.vocabList.length<1||!config.reference){alert('請填寫訓練名稱、至少 3 個物件、核心詞彙與參考答案。');return}step=0;seen=[];$('#builder').style.display='none';$('#training').style.display='block';refreshPreview();render();$('#training').scrollIntoView({behavior:'smooth'})}
    const names=['場景觀察','目的選擇','關鍵字組句','無提示回想','比較報告'];
    function renderProgress(){$('#progress').innerHTML=names.map((x,i)=>`<div class="step ${i===step?'on':i<step?'done':''}">${i+1}<br>${x}</div>`).join('')}
    function next(){step=Math.min(4,step+1);render()}
    function compare(answer,reference,label){$('#feedback').className='feedback show';$('#feedback').innerHTML=`<div class="compare"><div class="answer"><small>你的回答</small>${escapeHtml(answer||'（未填寫）')}</div><div class="answer ref"><small>參考答案</small>${escapeHtml(reference)}</div></div><div class="actions"><button class="btn" onclick="next()">${label}</button></div>`}
    function submitPurpose(){const picked=document.querySelector('input[name=purpose]:checked');compare(picked?.value||'',config.goal,'進入關鍵字組句')}
    function submitSentence(){const input=$('#sentence');input.disabled=true;compare(input.value,config.reference,'進入無提示回想')}
    function submitRecall(){const input=$('#recall');input.disabled=true;compare(input.value,`${config.time}，在${config.place}。我是${config.userRole}，需要${config.goal}。突發狀況是${config.surprise}。\n${config.reference}`,'查看比較報告')}
    function render(){renderProgress();const a=$('#activity');if(step===0)a.innerHTML=`<h2>1. 場景觀察</h2><p>請在上方場景點選至少 3 個物件，建立空間與物件記憶。</p><div class="object-check"><span class="check done">已觀察 <b id="seenCount">${Math.min(seen.length,3)}</b>/3</span><span class="check">AI：${escapeHtml(config.aiRole)}</span><span class="check">你：${escapeHtml(config.userRole)}</span></div><button id="observeNext" class="btn" ${seen.length<3?'disabled':''} onclick="next()">完成場景觀察</button>`;
      if(step===1)a.innerHTML=`<h2>2. 選擇溝通目的</h2><p>在這個情境中，你最需要完成什麼？</p><div class="options">${[config.goal,'立刻結束對話，不處理突發狀況','只詢問場景中有哪些物件'].map(x=>`<label class="option"><input type="radio" name="purpose" value="${escapeHtml(x)}"> ${escapeHtml(x)}</label>`).join('')}</div><div class="actions"><button class="btn" onclick="submitPurpose()">送出選擇</button></div><div id="feedback" class="feedback"></div>`;
      if(step===2)a.innerHTML=`<h2>3. 關鍵字組句</h2><p>使用任意核心詞彙完成一句話；無論內容是否完整都可以送出並查看參考答案。</p><div class="object-check">${config.vocabList.map(x=>`<span class="check done">${escapeHtml(x)}</span>`).join('')}</div><textarea id="sentence" class="input" placeholder="請用 ${escapeHtml(config.language)} 回應"></textarea><div class="actions"><button class="btn" onclick="submitSentence()">送出並查看參考答案</button></div><div id="feedback" class="feedback"></div>`;
      if(step===3)a.innerHTML=`<h2>4. 無提示場景回想</h2><p>不回看設定欄，回想時間、地點、人物、目的、突發狀況，並寫出你的回應。</p><textarea id="recall" class="input" placeholder="完全無提示回答……"></textarea><div class="actions"><button class="btn" onclick="submitRecall()">完成回想並比較</button></div><div id="feedback" class="feedback"></div>`;
      if(step===4)a.innerHTML=`<h2>5. 訓練比較報告</h2><div class="report-grid"><div class="metric">場景物件<b>${config.objectList.length}</b></div><div class="metric">核心詞彙<b>${config.vocabList.length}</b></div><div class="metric">完成階段<b>5/5</b></div></div><div class="mission"><b>本次參考答案</b><br>${escapeHtml(config.reference)}<br><br><b>建議：</b>更換一個人物、一個物件或一個突發狀況後，再做一次無提示回答。</div><div class="actions"><button class="btn" onclick="location.reload()">建立另一個場景</button><a class="btn secondary" href="../context-hook-training/">返回情境鉤子 Demo</a></div>`}
    $('#presets').innerHTML=Object.entries(presets).map(([key,p])=>`<button class="preset" data-key="${key}" onclick="choosePreset('${key}')">${p.label}</button>`).join('');choosePreset('cafe');
  </script>
</body>
</html>
