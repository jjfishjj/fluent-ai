<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>情境鉤子卡 Demo · Fluent AI</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#111827;font-family:Inter,"Noto Sans TC",system-ui,sans-serif}.top{height:68px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 5vw;position:sticky;top:0;z-index:10}.back{color:#334155;text-decoration:none;font-weight:800}.wrap{max-width:1180px;margin:auto;padding:28px 20px 64px}.hero{position:relative;overflow:hidden;background:#111936;color:#fff;border-radius:28px;padding:42px}.hero:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:#28d7b833;filter:blur(35px);right:-80px;top:-90px}.eyebrow{color:#72f3df;font-size:12px;font-weight:900;letter-spacing:.18em}.hero h1{font-size:clamp(31px,5vw,48px);line-height:1.15;margin:14px 0}.hero p{max-width:720px;color:#cbd5e1;line-height:1.8}.grid{display:grid;grid-template-columns:1fr 360px;gap:22px;margin-top:24px}.stack{display:grid;gap:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:22px}.card h2,.card h3{margin-top:0}.words{display:flex;gap:9px;flex-wrap:wrap}.word{border:1px solid #d6dce5;background:#fff;border-radius:12px;padding:10px 16px;font-weight:900;cursor:pointer}.word.on{background:#12a893;color:#fff;border-color:#12a893}.meaning{background:#f8fafc;border-radius:14px;padding:16px;margin-top:16px;line-height:1.6}.polarity{display:grid;grid-template-columns:1fr 1fr;gap:14px}.choice{border:2px solid #e5e7eb;background:#fff;border-radius:19px;padding:18px;text-align:left;cursor:pointer}.choice b{display:block;font-size:18px;margin:10px 0}.choice.good.on{background:#ecfdf5;border-color:#34d399}.choice.bad.on{background:#fff1f2;border-color:#fb7185}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.detail{background:#f8fafc;border-radius:14px;padding:15px;line-height:1.6}.detail small{display:block;color:#0d9488;font-weight:900;margin-bottom:6px}.line{margin-top:12px;background:#eafbf7;border:1px solid #a8eadc;border-radius:14px;padding:16px;font-weight:800}.live{border-radius:24px;background:linear-gradient(145deg,#18ad80,#0f8c82);padding:26px;color:#fff;box-shadow:0 16px 34px #0f8c8233;position:sticky;top:92px}.live.bad{background:linear-gradient(145deg,#ed5067,#ed7845)}.live .emoji{font-size:54px;margin:26px 0 18px}.live h2{font-size:27px}.live p{color:#ffffffcc;line-height:1.7}.quote{background:#ffffff18;border-radius:14px;padding:16px;line-height:1.7;margin-top:22px}.coach{margin-top:16px;background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:19px;line-height:1.7}.label{font-size:13px;font-weight:900;margin-bottom:8px}textarea{width:100%;min-height:130px;border:1px solid #cbd5e1;border-radius:14px;padding:15px;font:inherit;resize:vertical}@media(max-width:850px){.grid{grid-template-columns:1fr}.live{position:static}.hero{padding:30px}}@media(max-width:580px){.polarity,.details{grid-template-columns:1fr}.hero h1 br{display:none}}
  </style>
</head>
<body>
  <header class="top"><a class="back" href="../../practice">← 返回 Fluent AI 練習場</a></header>
  <main class="wrap">
    <section class="hero"><div class="eyebrow">SCENE ANCHOR LAB · DEMO</div><h1>把單字放進成功與失敗的<br>真實情境</h1><p>不要只背中文意思。比較正向與負向結果，讓大腦知道這個單字何時會出現。</p></section>
    <div class="grid"><section class="stack"><div class="card"><h3>選擇要記住的單字</h3><div id="words" class="words"></div><div id="meaning" class="meaning"></div></div><div id="polarity" class="polarity"><button class="choice good on" data-p="positive">👍 正向情境<b id="goodTitle"></b><span>透過溝通、交換條件，找到雙方可接受的結果。</span></button><button class="choice bad" data-p="negative">👎 負向情境<b id="badTitle"></b><span>缺少傾聽或讓步，導致協商失敗。</span></button></div><div class="card"><h3>場景／動作／角色範例</h3><div id="details" class="details"></div><div id="sentence" class="line"></div></div><div class="card"><div class="label">關掉提示後，用自己的話演一次</div><textarea id="recall" placeholder="我在什麼地方？和誰互動？為什麼需要使用這個單字？最後發生什麼事？"></textarea></div></section><aside><div id="live" class="live"><div class="eyebrow">LIVE SCENE CARD</div><div id="emoji" class="emoji">🤝</div><h2 id="liveTitle"></h2><p id="liveMeta"></p><div id="quote" class="quote"></div></div><div class="coach"><b>視覺型學習提示 👁️</b><p>用兩張對比畫面區分「成功談成」與「談判破裂」，讓場景顏色與結果綁定。</p></div></aside></div>
  </main>
  <script>
    const scenes={Negotiate:{meaning:'協商；透過溝通調整條件，找出雙方可接受的方案',positive:{title:'雙方找到共同方案',place:'明亮的會議室',role:'你是專案經理，對方是客戶',action:'你拿出時程表，交換條件後握手',line:'We negotiated a deadline that works for both teams.'},negative:{title:'堅持立場，談判破裂',place:'氣氛緊繃的會議室',role:'你是供應商，對方是採購主管',action:'雙方提高音量，對方收起文件離席',line:'We failed to negotiate because neither side would compromise.'}},Persuade:{meaning:'說服；運用理由或情感，使他人願意採取行動',positive:{title:'提案獲得支持',place:'團隊簡報室',role:'你是提案人，對方是主管',action:'你展示證據，主管點頭同意',line:'I persuaded my manager to test the new idea.'},negative:{title:'理由不足，沒有說服',place:'臨時會議',role:'你是組員，對方是團隊',action:'你只重複結論，大家露出疑惑表情',line:'I could not persuade them without clear evidence.'}},Apologize:{meaning:'道歉；承認造成的影響並表達歉意',positive:{title:'真誠道歉，修復關係',place:'安靜的咖啡店',role:'你與一位朋友',action:'你看著對方，承認錯誤並提出補救',line:'I apologized for missing our appointment.'},negative:{title:'敷衍道歉，衝突加深',place:'忙亂的辦公室',role:'你與同事',action:'你邊看手機邊說抱歉，沒有承認問題',line:'He apologized, but he did not take responsibility.'}}};
    let word='Negotiate',polarity='positive';const words=document.querySelector('#words');words.innerHTML=Object.keys(scenes).map(w=>`<button class="word ${w===word?'on':''}" data-w="${w}">${w}</button>`).join('');
    function render(){const s=scenes[word],a=s[polarity];document.querySelector('#meaning').innerHTML=`<b style="font-size:22px">${word}</b><br>${s.meaning}`;goodTitle.textContent=s.positive.title;badTitle.textContent=s.negative.title;details.innerHTML=[['場景',a.place],['角色',a.role],['動作',a.action]].map(x=>`<div class="detail"><small>${x[0]}</small>${x[1]}</div>`).join('');sentence.textContent=a.line;liveTitle.textContent=a.title;liveMeta.innerHTML=a.place+'<br>'+a.role;quote.textContent='「'+a.line+'」';emoji.textContent=polarity==='positive'?'🤝':'💥';live.classList.toggle('bad',polarity==='negative');document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('on',x.dataset.p===polarity));document.querySelectorAll('.word').forEach(x=>x.classList.toggle('on',x.dataset.w===word));recall.placeholder=`我在什麼地方？和誰互動？為什麼需要 ${word.toLowerCase()}？最後發生什麼事？`}
    words.onclick=e=>{const b=e.target.closest('.word');if(b){word=b.dataset.w;recall.value='';render()}};document.querySelector('#polarity').onclick=e=>{const b=e.target.closest('.choice');if(b){polarity=b.dataset.p;render()}};render();
  </script>
</body>
</html>
