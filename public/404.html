<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Fluent AI</title>
    <script>
      (function(location) {
        var pathSegmentsToKeep = 1;
        var segments = location.pathname.split("/");
        var basePath = segments.slice(0, 1 + pathSegmentsToKeep).join("/");
        var appPath = segments.slice(1 + pathSegmentsToKeep).join("/");
        location.replace(
          location.protocol +
            "//" +
            location.hostname +
            (location.port ? ":" + location.port : "") +
            basePath +
            "/?/" +
            appPath.replace(/&/g, "~and~") +
            (location.search ? "&" + location.search.slice(1).replace(/&/g, "~and~") : "") +
            location.hash
        );
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
