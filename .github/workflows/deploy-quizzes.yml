name: Deploy Fluent AI to GitHub Pages

# Publishes the complete Fluent AI app plus standalone quizzes and pitch deck.
#
# ONE-TIME SETUP: this requires GitHub Pages to be enabled with the
# "GitHub Actions" source (Repo → Settings → Pages → Source: GitHub Actions).
# The Actions token cannot enable Pages automatically on this repo, so that
# toggle must be flipped once by a repo admin; afterwards every push deploys.
# (The quizzes also deploy automatically via Vercel at /quizzes/* with no
# settings change — see vercel.json.)

on:
  # Auto-deploys once merged to main (and after Pages is enabled, see note above).
  # Feature-branch previews are covered by Vercel, so we don't run Pages there.
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'quizzes/**'
      - 'pitch/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/deploy-quizzes.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app for GitHub Pages
        env:
          GITHUB_PAGES: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Add standalone experiences
        run: |
          mkdir -p dist/quizzes/memory-quiz dist/quizzes/memory-genius-quiz dist/pitch
          cp quizzes/index.html dist/quizzes/index.html
          cp quizzes/memory-quiz/index.html dist/quizzes/memory-quiz/index.html
          cp quizzes/memory-genius-quiz/index.html dist/quizzes/memory-genius-quiz/index.html
          cp quizzes/memory-genius-quiz/scoring.js dist/quizzes/memory-genius-quiz/scoring.js
          cp pitch/index.html dist/pitch/index.html
          cp public/404.html dist/404.html
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
